# CI de package

variables:
  NODE_VERSION: 22.23.2
  DOCKERFILE_PATH: $WORKING_DIR/Dockerfile
  # Base Postgres pour les tests
  POSTGRES_DB: ulep
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST_AUTH_METHOD: trust

stages:
  - 🔩 .pre
  - 📦 build

# Base commune
.base:
  image: node:$NODE_VERSION-alpine
  before_script: # Activation de corepack pour pouvoir utiliser pnpm
    - corepack enable
    - corepack prepare --activate pnpm@11.24.0
    - cd $WORKING_DIR
    - apk update
    - apk add --no-cache openssl # pour les tests prisma

# Installation des dépendances
⚙️ dependencies:
  stage: 🔩 .pre
  extends: .base
  script: # (cache pas forcément utile : https://pnpm.io/fr/continuous-integration)
    # Si pas --no-frozen-lockfile alors ERR_PNPM_OUTDATED_LOCKFILE  Cannot install with "frozen-lockfile" because pnpm-lock.yaml is not up to date with package.json
    # Il ne devrait pas y avoir cette erreur. Une autre option pour remplacer --no-frozen-lockfile est --fix-lockfile
    - pnpm i --no-frozen-lockfile # cf .circleci/config.yml
  artifacts:
    paths:
      - $CI_PROJECT_DIR/$WORKING_DIR/node_modules
    expire_in: 1 hour
  rules:
    - if: ($LINT == 'enabled' || $TEST == 'enabled' || $DOCKERFILE_PATH != "$WORKING_DIR/Dockerfile")

# Lint
🛡️ lint:
  stage: 🔩 .pre
  extends: .base
  needs:
    - job: ⚙️ dependencies
  script:
    - pnpm run lint
  allow_failure: true  
  rules:
    - if: $LINT == 'enabled'

# Test
🛡️ test:
  stage: 🔩 .pre
  variables:
    KUBERNETES_CPU_LIMIT: "1"
    KUBERNETES_MEMORY_LIMIT: "2Gi"
  extends: .base
  needs:
    - job: ⚙️ dependencies
  services: # https://docs.gitlab.com/ee/ci/services/postgres.html (https://knasmueller.net/gitlab-postgresql-testing-pipeline)
    - postgres:14-alpine
  script:
    - echo "DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB" > .env
    - pnpm prisma generate
    - pnpm run test
  rules:
    - if: $TEST == 'enabled'

# Build
.build:
  stage: 📦 build
  variables:
    KUBERNETES_CPU_LIMIT: "1"
    KUBERNETES_MEMORY_LIMIT: "2Gi"
  extends: .base
  needs:
    - job: ⚙️ dependencies
    - job: 🛡️ lint
      optional: true
    # Empêche le build si ce job est en erreur
    - job: 🛡️ test
      optional: true

# Build de l'api (uniquement si on utilise un Dockerfile différent de celui par défaut)
⚙️ api:
  extends: .build
  script:
    - pnpm prisma generate
    - pnpm run build
    # - pnpm install --prod (génère une erreur dans le pod même en mode prod : Error: Cannot find module '@faker-js/faker')
  artifacts:
    paths:
      - $CI_PROJECT_DIR/$WORKING_DIR/dist
      - $CI_PROJECT_DIR/$WORKING_DIR/package.json
      - $CI_PROJECT_DIR/$WORKING_DIR/node_modules
    expire_in: 1 hour
  rules:
    - if: $WORKING_DIR == "api" && $DOCKERFILE_PATH != "$WORKING_DIR/Dockerfile"

⚙️ chat:
  extends: .build
  script:
    - pnpm prisma generate
    - pnpm run build
    # - pnpm install --prod (génère une erreur dans le pod même en mode prod : Error: Cannot find module '@faker-js/faker')
  artifacts:
    paths:
      - $CI_PROJECT_DIR/$WORKING_DIR/dist
      - $CI_PROJECT_DIR/$WORKING_DIR/package.json
      - $CI_PROJECT_DIR/$WORKING_DIR/node_modules
    expire_in: 1 hour
  rules:
    - if: $WORKING_DIR == "chat" && $DOCKERFILE_PATH != "$WORKING_DIR/Dockerfile"

# Build de l'admin (uniquement si on utilise un Dockerfile différent de celui par défaut)
🖥️ admin:
  extends: .build
  tags:
    - sied
  script:
    - env | grep -E "GENERATE_SOURCEMAP|DISABLE_ESLINT"
    - pnpm run build
    # - pnpm install --prod (génère une erreur dans le pod même en mode prod : Error: Cannot find module '@faker-js/faker')
  artifacts:
    paths:
      - $CI_PROJECT_DIR/$WORKING_DIR
      # A utiliser à la place de la ligne précédente si les sources ne sont plus nécessaires dans le fichier de déploiement Helm
      # - $CI_PROJECT_DIR/$WORKING_DIR/build
      # - $CI_PROJECT_DIR/$WORKING_DIR/node_modules
    expire_in: 1 hour
  rules:
    - if: $WORKING_DIR == "admin" && $DOCKERFILE_PATH != "$WORKING_DIR/Dockerfile"

# Build de l'image
🚀 container image:
  stage: 📦 build
  tags:
    - sied
  variables:
    KUBERNETES_CPU_LIMIT: "1"
    KUBERNETES_MEMORY_LIMIT: "2Gi"
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  needs:
    - job: 🛡️ lint
      optional: true
    - job: 🛡️ test
      optional: true
    - job: 🖥️ admin
      optional: true
    - job: ⚙️ api
      optional: true
    - job: ⚙️ chat
      optional: true
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  before_script: # Informations de connexion au registry Harbor dans la conf Docker
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > ~/.docker/config.json
  script:
    - |
      # Option de target (BuildKit ignore déjà les stages non utilisés par défaut)
      TARGET_OPTS=""
      if [ -n "$DOCKER_TARGET" ]; then
        TARGET_OPTS="--opt target=$DOCKER_TARGET"
      fi

      # Tag de version (extraction depuis package.json, ou TAG fourni manuellement)
      if [ -z "$TAG" ]; then
        #TAG=$(cat "$CI_PROJECT_DIR/$WORKING_DIR/package.json" | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')
        TAG=$(awk -F '"' '/"version":/ {print $4; exit}' "$CI_PROJECT_DIR/$WORKING_DIR/package.json")
      fi

      # Cache des couches déposé dans le registre, sous forme d'un tag "buildcache" sur le
      # repository de l'image elle-même (IMAGE_NAME peut contenir un namespace type "ulep/admin",
      # ce qui est invalide comme TAG mais valide comme repository).
      CACHE_REF="$CI_REGISTRY_IMAGE/$IMAGE_NAME:buildcache"

      # Étiquettes :
      #   <sha>     immuable, permet un déploiement reproductible, quelle que soit la branche
      #   <version> numéro de package.json ; sur main c'est la version "officielle",
      #             sur une autre branche elle est suffixée par le nom de la branche pour
      #             ne pas écraser les images de main
      #   latest    dernier build de la branche principale uniquement
      BUILD_ARGS="--opt build-arg:NODE_VERSION=$NODE_VERSION"
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        TAGS="$CI_COMMIT_SHORT_SHA $TAG latest"
        # On ne réalimente le cache que depuis main : une branche d'essai en profite,
        # mais ne le pollue pas.
        EXPORT_CACHE="--export-cache type=registry,ref=$CACHE_REF,mode=max"
      else
        BUILD_ARGS="$BUILD_ARGS --opt build-arg:NODE_ENV_CI=development"
        TAGS="$CI_COMMIT_SHORT_SHA $TAG-$CI_COMMIT_REF_SLUG"
        EXPORT_CACHE=""
      fi

      # BuildKit attend toutes les destinations dans un seul champ « name », séparées par
      # des virgules. Les guillemets échappés sont indispensables : sans eux, buildctl
      # prendrait chaque virgule pour un nouveau paramètre.
      NAMES=""
      for T in $TAGS; do
        NAMES="${NAMES:+$NAMES,}$CI_REGISTRY_IMAGE/$IMAGE_NAME:$T"
      done

      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context="$CI_PROJECT_DIR/$WORKING_DIR" \
        --local dockerfile="$CI_PROJECT_DIR/$(dirname "$DOCKERFILE_PATH")" \
        --opt filename="$(basename "$DOCKERFILE_PATH")" \
        $TARGET_OPTS \
        $BUILD_ARGS \
        --output type=image,\"name=$NAMES\",push=true \
        --import-cache type=registry,ref="$CACHE_REF" \
        $EXPORT_CACHE