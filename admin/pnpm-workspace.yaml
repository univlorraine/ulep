# Réglages pnpm : depuis pnpm 11, le champ "pnpm" de package.json n'est plus lu.
overrides:
  ra-ui-materialui: 5.10.1
  ra-core: 5.10.1

# Une install pnpm 11 échoue si un script de build n'est ni autorisé ni refusé.
# Ces scripts s'exécutaient déjà sous pnpm 10 : on les autorise explicitement,
# pour reproduire le comportement à l'identique.
allowBuilds:
  core-js: true
  core-js-pure: true
  lint: true
