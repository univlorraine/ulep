# Réglages pnpm : depuis pnpm 11, le champ "pnpm" de package.json n'est plus lu.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - x64
    - arm64

# Une install pnpm 11 échoue si des scripts de build ne sont ni autorisés ni
# refusés. Ces scripts étaient déjà ignorés sous pnpm 10 : comportement inchangé,
# simplement explicite. Le client Prisma est généré séparément dans le Dockerfile.
allowBuilds:
  '@nestjs/core': false
  '@prisma/client': false
  '@prisma/engines': false
  prisma: false
  sharp: false
